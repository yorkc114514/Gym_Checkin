<!DOCTYPE html>
<html lang="zh-Hant"><!-- 開始 HTML 文件並指定語系 -->
  <head><!-- 開始文件標題、樣式與模組設定 -->
    <meta charset="UTF-8" /><!-- 指定文件字元編碼，正確顯示中文 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" /><!-- 設定裝置寬度與初始縮放，讓手機使用響應式版面 -->
    <title>簽到紀錄｜運動科學實驗室簽到系統</title><!-- 設定瀏覽器分頁標題 -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.css"
    /><!-- 提供前一 HTML 元素的文字內容或續接其標籤屬性 -->
    <link rel="stylesheet" href="./assets/styles.css" /><!-- 載入 ./assets/styles.css 樣式或外部資源 -->
    <script type="module" src="./assets/pages/history.js"></script><!-- 載入 ./assets/pages/history.js 頁面程式；module 會使用 ES 模組相依關係 -->
  </head><!-- 結束 head 容器或文字區塊 -->
  <body data-page="history" data-title="簽到紀錄"><!-- 開始可見頁面並提供頁面識別資訊 -->
    <main class="page-container"><!-- 開始頁面主要內容 -->
      <div class="page-heading"><!-- 建立版面容器 -->
        <h1>簽到紀錄查詢</h1><!-- 顯示頁面主標題 -->
        <p>依日期查看使用身分、進出時間、協助簽退及責任交接紀錄。</p><!-- 顯示操作說明或提示 -->
      </div><!-- 結束 div 容器或文字區塊 -->

      <div id="message" class="message hidden"></div><!-- 建立或續接 #message 介面控制項，供樣式與 JavaScript 定位 -->

      <section class="card"><!-- 建立功能內容區 -->
        <div class="date-controls"><!-- 建立版面容器 -->
          <label for="history-date"><!-- 建立輸入欄位標籤 -->
            查詢日期
            <input
              id="history-date"
              type="text"
              placeholder="YYYY-MM-DD"
              autocomplete="off"
              inputmode="none"
            /><!-- 提供前一 HTML 元素的文字內容或續接其標籤屬性 -->
          </label><!-- 結束 label 容器或文字區塊 -->
          <button id="history-refresh-button" class="secondary-button" type="button"><!-- 建立或續接 #history-refresh-button 介面控制項，供樣式與 JavaScript 定位 -->
            查詢紀錄
          </button><!-- 結束 button 容器或文字區塊 -->
        </div><!-- 結束 div 容器或文字區塊 -->
        <p class="date-marker-hint"><!-- 顯示操作說明或提示 -->
          <span class="date-marker-dot" aria-hidden="true"></span><!-- 包覆一段行內文字或狀態 -->
          日曆上的藍點代表當天有簽到紀錄。
        </p><!-- 結束 p 容器或文字區塊 -->

        <p id="history-status" class="section-status" aria-live="polite"> 正在讀取簽到紀錄…… </p><!-- 建立或續接 #history-status 介面控制項，供樣式與 JavaScript 定位 -->
        <ul id="history-list" class="history-list"></ul><!-- 建立或續接 #history-list 介面控制項，供樣式與 JavaScript 定位 -->
      </section><!-- 結束 section 容器或文字區塊 -->
    </main><!-- 結束 main 容器或文字區塊 -->
  </body><!-- 結束 body 容器或文字區塊 -->
</html><!-- 結束 html 容器或文字區塊 -->
